<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Twigg Links</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <form id="form">
      <label for="repo">Twigg repository</label>
      <input id="repo" type="text" placeholder="user/repo" autocomplete="off" spellcheck="false" />
      <p class="hint">
        <code>user/repo</code> or a repo link like <code>https://twigg.vc/user/repo</code>.
      </p>
      <p class="hint">
        In the address bar, <code>go/my-alias</code> opens the destination defined
        for <code>my-alias</code> in this repo's <code>GOLINKS</code> file.
        <code>b/123</code> opens bug 123 and <code>c/123</code> opens commit 123 in this repo.
      </p>
      <button type="submit">Save</button>
      <p id="status" class="status"></p>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
